name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      # 1️⃣ Checkout du code
      - uses: actions/checkout@v4

      # 2️⃣ Installer Java/Maven
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven


      - name: Build with Maven
        run: mvnw clean package -DskipTests

      # 4️⃣ Message de test
      - name: Echo test
        run: echo "Build terminé !"

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      # Checkout du code pour le déploiement
      - uses: actions/checkout@v4

      - name: Déploiement local
        run: |
          cd $GITHUB_WORKSPACE
          echo "Déploiement sur la VM en cours..."
          docker compose down || true
          docker compose up -d --build
