version: "3.9"
services:
  brockerx:
    build: .
    ports:
      - "8080:8080"
    depends_on:
        - db
    environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/brokerx_db
        SPRING_DATASOURCE_USERNAME: brokerx
        SPRING_DATASOURCE_PASSWORD: secret

  db:
    image: postgres:15
    container_name: brockerx-db
    environment:
      POSTGRES_USER: brokerx
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: brokerx_db
    ports:
      - "5432:5432"