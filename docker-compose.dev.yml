version: "3.9"

services:
  # --- APP SPRING BOOT MASTER ---
  brockerx1:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: brockerx-master
    ports:
      - "8081:8080"
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - ./target:/app/target
    environment:
      SPRING_PROFILES_ACTIVE: db-master,dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/brockerx
      SPRING_DATASOURCE_USERNAME: brockerx
      SPRING_DATASOURCE_PASSWORD: brockerx
    command: mvn spring-boot:run
    depends_on:
      - db
    restart: always

  # --- APP SPRING BOOT SLAVE ---
  brockerx2:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: brockerx-slave
    ports:
      - "8082:8080"
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - ./target:/app/target
    environment:
      SPRING_PROFILES_ACTIVE: db-slave,dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/brockerx
      SPRING_DATASOURCE_USERNAME: brockerx
      SPRING_DATASOURCE_PASSWORD: brockerx
    command: mvn spring-boot:run
    depends_on:
      - db
    restart: always

  # --- BASE DE DONNÉES ---
  db:
    image: postgres:15
    container_name: brockerx-db
    environment:
      POSTGRES_USER: brockerx
      POSTGRES_PASSWORD: brockerx
      POSTGRES_DB: brockerx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # --- PROMETHEUS ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - brockerx1
      - brockerx2
    restart: always

  # --- GRAFANA ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

  # --- K6 (TESTS DE CHARGE) ---
  k6:
    image: grafana/k6
    container_name: k6
    volumes:
      - ./k6:/scripts
    entrypoint: [ "sleep", "infinity" ]
    restart: always

  # --- NGINX LOAD BALANCER ---
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - brockerx1
      - brockerx2
    restart: always

volumes:
  postgres_data:
  grafana_data:
